name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: coordinator, POSTGRES_PASSWORD: coordinator, POSTGRES_DB: coordinator }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U coordinator" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint
        run: ruff check app tests
      - name: Tests (labelled replies, Jev contract, full loop, meetings)
        run: pytest -q
      - name: Migrations apply cleanly to Postgres and match the models
        env: { DATABASE_URL: "postgresql+psycopg://coordinator:coordinator@localhost:5432/coordinator" }
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build        # type-checks with tsc, then bundles

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: deploy/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
