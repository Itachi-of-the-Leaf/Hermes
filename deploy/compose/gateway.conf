# Local stand-in for the AWS Application Load Balancer: same path routing.
upstream api { server api:8000; }       # Docker DNS round-robins across api replicas
upstream web { server web:80; }

server {
  listen 80;
  client_max_body_size 10m;              # transcript uploads

  location /api/stream {                 # Server-Sent Events: no buffering, long reads
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { proxy_pass http://web; }
}
