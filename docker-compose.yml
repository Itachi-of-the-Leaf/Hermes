# Production-shaped local stack. Mirrors AWS:
#   gateway (= ALB)  ->  web (nginx static)  and  api x2 (FastAPI)
#   worker x1 (Telegram polling, scheduler, jobs)   postgres (= RDS)   redis (= ElastiCache)
#   otel-lgtm (= X-Ray + CloudWatch): Grafana at http://localhost:3000
#
#   cp backend/.env.example backend/.env    # add your tokens
#   docker compose up --build               # app at http://localhost:8080

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env               # your tokens; per-service environment below wins
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: coordinator
      POSTGRES_DB: coordinator
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://coordinator:coordinator@postgres:5432/coordinator
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      ROLE: api
      OTEL_SERVICE_NAME: coordinator-api
      APP_ENV: ${APP_ENV:-dev}           # dev keeps reset + test panel; prod hides them
      DATABASE_URL: postgresql+psycopg://coordinator:coordinator@postgres:5432/coordinator
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      LOG_JSON: "true"
    deploy:
      replicas: 2                      # proves the Redis event bus: SSE works on either replica

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      ROLE: worker
      OTEL_SERVICE_NAME: coordinator-worker
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://coordinator:coordinator@postgres:5432/coordinator
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      LOG_JSON: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat')<90 else 1)"]
      interval: 30s

  web:
    build: ./frontend

  gateway:
    image: nginx:1.27-alpine
    volumes: [./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    depends_on: [api, web]

  otel-lgtm:                           # Grafana + Tempo (traces) + Prometheus (metrics) + Loki, one container
    image: grafana/otel-lgtm:latest
    ports: ["3000:3000"]

volumes:
  pgdata:
