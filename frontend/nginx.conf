server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz { access_log off; return 200 "ok"; }

  # Vite fingerprints asset names, so they can be cached forever.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Two pages, never cached so deploys show up at once: the dashboard (a hash-routed app) and the landing page.
  location = /dashboard { return 301 /dashboard/; }
  location /dashboard/ { add_header Cache-Control "no-cache"; try_files $uri /dashboard/index.html; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
